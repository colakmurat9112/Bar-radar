name: weekly-bar-radar

on:
  schedule:
    - cron: "0 4 * * 1" # Her Pazartesi sabah 04:00'te çalışır
  workflow_dispatch: # Manuel tetikleme butonu

permissions:
  contents: write

jobs:
  run-radar:
    runs-on: ubuntu-latest
    steps:
      - name: Repoyu Klonla
        uses: actions/checkout@v4

      - name: Python Kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Ücretsiz Tarayıcı (Playwright) Kur
        run: |
          pip install playwright
          playwright install chromium

      - name: Botu Çalıştır (Sıfır Maliyet)
        run: python scripts/radar.py

      - name: Değişiklikleri Kaydet ve Pushla
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          git add state.json docs/results.json
          git commit -m "Radar güncellendi (Playwright)" || echo "Değişiklik yok"
          git push
          
