<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bar Radar</title>
<style>
  body{font:15px/1.5 system-ui,sans-serif;margin:0;background:#14110f;color:#eee}
  header{padding:16px 16px 8px;max-width:780px;margin:auto;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px}
  h1{margin:0;font-size:21px}
  .sub{color:#999;font-size:13px;width:100%}
  .tabs{max-width:780px;margin:8px auto;padding:0 16px;display:flex;gap:8px}
  .tab{flex:1;padding:10px;border-radius:10px;border:1px solid #3a332d;background:#1f1a16;color:#aaa;font-weight:600;cursor:pointer;text-align:center;font-size:14px}
  .tab.active{background:#c8923a;color:#14110f;border-color:#c8923a}
  .bar{max-width:780px;margin:8px auto;padding:0 16px;display:flex;gap:8px;flex-wrap:wrap}
  select,input{flex:1;min-width:140px;padding:10px;border-radius:8px;border:1px solid #3a332d;background:#1f1a16;color:#eee;font-size:14px}
  button.btn{background:#2c2520;color:#eee;border:1px solid #4a4039;padding:8px 12px;border-radius:8px;cursor:pointer;font-size:13px;font-weight:600}
  button.btn-gold{background:#c8923a;color:#14110f;border:none}
  main{max-width:780px;margin:auto;padding:8px 16px 40px}
  .card{background:#1f1a16;border:1px solid #3a332d;border-radius:12px;padding:14px 16px;margin:12px 0}
  .card.rejected{opacity:0.75;border-color:#522}
  .card h2{margin:0 0 4px;font-size:18px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
  .meta{color:#aaa;font-size:13px;margin-bottom:8px}
  .badge{background:#2d2620;color:#c8923a;border:1px solid #c8923a;border-radius:6px;padding:1px 7px;font-size:11px;font-weight:600}
  .badge.bad{color:#ff8080;border-color:#ff8080;background:#2a1515}
  .badge.ok{color:#6ee7b7;border-color:#6ee7b7;background:#132a20}
  .ai-box{background:#161310;border-left:3px solid #c8923a;padding:10px 12px;margin:10px 0;border-radius:6px;font-size:14px}
  .actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
  a.map{display:inline-block;background:#c8923a;color:#14110f;text-decoration:none;font-weight:600;padding:8px 12px;border-radius:8px;font-size:13px}
  details{margin-top:8px;font-size:13px;color:#bbb}
  summary{cursor:pointer;color:#c8923a}
  .empty{color:#999;text-align:center;margin-top:40px}
</style>
</head>
<body>
<header>
  <h1>🍸 Bar Radar</h1>
  <button class="btn btn-gold" id="batchAiBtn">⚡ Tümünü Ücretsiz AI ile Filtrele</button>
  <div class="sub" id="stats">Yükleniyor…</div>
</header>

<div class="tabs">
  <div class="tab active" id="tabFiltered">🎯 Filtrelenenler (Kokteyl Bar)</div>
  <div class="tab" id="tabRaw">📋 Önce Bulunanlar (Tümü)</div>
</div>

<div class="bar">
  <input id="q" type="search" placeholder="Ara (isim, kategori, özet)…">
  <select id="city"><option value="">Tüm şehirler</option></select>
</div>

<main id="list"></main>

<script>
(async () => {
  let data = [];
  try { data = await (await fetch("results.json?t=" + Date.now(), {cache: "no-store"})).json(); } catch (e) {}

  const localCache = JSON.parse(localStorage.getItem("bar_radar_free_ai") || "{}");
  const list = document.getElementById("list"), q = document.getElementById("q"), citySel = document.getElementById("city");
  let activeTab = "filtered";

  // Kategorileri otomatik tanıyan yerel akıllı motor
  function smartClassify(d) {
    const text = ((d.name || "") + " " + (d.category || "") + " " + (d.summary || "") + " " + ((d.reviews || []).join(" "))).toLowerCase();
    if (/mobil|cater|eventservice|verleih|wagen|truck|golddurst/.test(text)) {
      return {is_real_bar: false, type: "Mobil Bar / Catering", reason: "Mekan sabit bir bar değil, etkinlik/düğün için mobil bar kiralama servisi."};
    }
    if (/burger|hamburger|pizza|pizzeria|döner|kebab|steak|sushi|schnitzel|imbiss/.test(text)) {
      return {is_real_bar: false, type: "Restoran / Hamburgerci", reason: "Ana odak noktası yemek/hamburger servisi olan restoran."};
    }
    if (/shisha|hookah|nargile|tabak|wasserpfeife/.test(text)) {
      return {is_real_bar: false, type: "Shisha / Nargile Lounge", reason: "Mekan ağırlıklı olarak nargile (shisha) kafe/lounge konseptinde."};
    }
    return {is_real_bar: true, type: d.category || "Kokteyl Bar / Lounge", reason: "Yerleşik bar/lounge kriterlerine uygun görünüyor."};
  }

  function isRealBar(d) {
    if (localCache[d.id] && typeof localCache[d.id].is_real_bar === "boolean") {
      return localCache[d.id].is_real_bar;
    }
    if (typeof d.is_real_bar === "boolean") return d.is_real_bar;
    return smartClassify(d).is_real_bar;
  }

  [...new Set(data.map(d => d.city))].sort().forEach(c => {
    const o = document.createElement("option"); o.value = o.textContent = c; citySel.appendChild(o);
  });

  // Anahtarsız, tamamen ücretsiz AI çağrısı (Pollinations OpenAI Endpoint + Yerel Yedek)
  async function analyzeWithFreeAI(d) {
    const baseCheck = smartClassify(d);
    const revs = (d.reviews && d.reviews.length) ? d.reviews.slice(0, 8).join("\n") : (d.summary || "");
    const prompt = `Sen profesyonel bir bar danışmanısın. Şu mekanı analiz et:
Mekan Adı: ${d.name}
Şehir: ${d.city}
Kategori: ${d.category || "Belirtilmemiş"}
Yorumlar:
${revs}

Sadece şu JSON formatında Türkçe yanıt ver (başka hiçbir şey yazma):
{"is_real_bar": true veya false, "type": "Kokteyl Bar / Mobil Bar / Hamburgerci / Shisha Lounge", "summary": "3 cümlelik Türkçe özet: Bu mekan gerçek bir kokteyl bar mı yoksa yemekçi/mobil bar mı? Müşteriler hangi içecekleri, atmosferi veya fiyatları övmüş?"}`;

    try {
      const r = await fetch("https://text.pollinations.ai/", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({
          messages: [
            {role: "system", content: "Sadece geçerli JSON döndüren bir asistansın."},
            {role: "user", content: prompt}
          ],
          model: "openai",
          jsonMode: true
        })
      });
      if (!r.ok) throw new Error("Sunucu yoğun");
      const raw = await r.text();
      const jsonMatch = raw.match(/\{[\s\S]*\}/);
      if (jsonMatch) {
        const parsed = JSON.parse(jsonMatch[0]);
        localCache[d.id] = {
          is_real_bar: typeof parsed.is_real_bar === "boolean" ? parsed.is_real_bar : baseCheck.is_real_bar,
          type: parsed.type || baseCheck.type,
          summary: parsed.summary || baseCheck.reason
        };
        localStorage.setItem("bar_radar_free_ai", JSON.stringify(localCache));
        return;
      }
    } catch (e) {
      // Ücretsiz AI sunucusu yanıt vermezse yerel akıllı analiz devreye girer
    }

    localCache[d.id] = {
      is_real_bar: baseCheck.is_real_bar,
      type: baseCheck.type,
      summary: `${baseCheck.reason} (${d.rating}★ / ${d.reviews_count} yorum). Menü ve içki fotoğrafları için Maps bağlantısını aç.`
    };
    localStorage.setItem("bar_radar_free_ai", JSON.stringify(localCache));
  }

  function render() {
    const term = q.value.toLowerCase(), city = citySel.value;
    const filteredCount = data.filter(d => isRealBar(d)).length;
    document.getElementById("tabFiltered").textContent = `🎯 Filtrelenenler (${filteredCount})`;
    document.getElementById("tabRaw").textContent = `📋 Önce Bulunanlar (${data.length})`;

    const rows = data.filter(d => {
      if (activeTab === "filtered" && !isRealBar(d)) return false;
      if (city && d.city !== city) return false;
      const hay = (d.name + " " + (d.category || "") + " " + (d.summary || "")).toLowerCase();
      return !term || hay.includes(term);
    });

    document.getElementById("stats").textContent = `Toplam bulunan: ${data.length} • Gerçek Bar: ${filteredCount} • Gösterilen: ${rows.length}`;
    list.replaceChildren();

    if (!rows.length) {
      const empty = document.createElement("div");
      empty.className = "empty";
      empty.textContent = activeTab === "filtered"
        ? "Bu filtrede gerçek kokteyl bar kalmadı. 'Önce Bulunanlar (Tümü)' sekmesinden elenen mekanları görebilirsin."
        : "Henüz sonuç yok.";
      list.appendChild(empty);
      return;
    }

    rows.forEach(d => {
      const real = isRealBar(d);
      const autoInfo = smartClassify(d);
      const ai = localCache[d.id];

      const card = document.createElement("div");
      card.className = "card" + (real ? "" : " rejected");

      const h = document.createElement("h2");
      h.textContent = d.name;

      const badge = document.createElement("span");
      badge.className = "badge " + (real ? "ok" : "bad");
      badge.textContent = ai?.type || autoInfo.type;
      h.appendChild(badge);
      card.appendChild(h);

      const meta = document.createElement("div");
      meta.className = "meta";
      meta.textContent = `${d.city} • ⭐ ${d.rating} (${d.reviews_count} yorum) • İlk yorum: ${d.first_review}`;
      card.appendChild(meta);

      const aiBox = document.createElement("div");
      aiBox.className = "ai-box";
      aiBox.textContent = ai?.summary || `${autoInfo.reason} — ${d.summary || ""}`;
      card.appendChild(aiBox);

      if (d.reviews && d.reviews.length) {
        const det = document.createElement("details");
        const sum = document.createElement("summary");
        sum.textContent = `💬 Müşteri Yorumlarını Gör (${d.reviews.length})`;
        det.appendChild(sum);
        d.reviews.forEach(r => {
          const p = document.createElement("p");
          p.style.margin = "6px 0";
          p.textContent = r;
          det.appendChild(p);
        });
        card.appendChild(det);
      }

      const actions = document.createElement("div");
      actions.className = "actions";

      if (d.maps_url) {
        const a = document.createElement("a");
        a.className = "map";
        a.href = d.maps_url; a.target = "_blank"; a.rel = "noopener";
        a.textContent = "📍 Maps'te Aç (Menü)";
        actions.appendChild(a);
      }

      const aiBtn = document.createElement("button");
      aiBtn.className = "btn";
      aiBtn.textContent = "🤖 Ücretsiz AI ile Özetle";
      aiBtn.onclick = async () => {
        aiBtn.textContent = "⏳ Analiz ediliyor...";
        await analyzeWithFreeAI(d);
        render();
      };
      actions.appendChild(aiBtn);

      const toggleBtn = document.createElement("button");
      toggleBtn.className = "btn";
      toggleBtn.textContent = real ? "❌ Bar Değil (Ayır)" : "✅ Gerçek Bar (Onayla)";
      toggleBtn.onclick = () => {
        localCache[d.id] = {
          ...(localCache[d.id] || {}),
          is_real_bar: !real,
          type: !real ? "Onaylı Kokteyl Bar" : "Elendi (Mobil/Restoran)",
          summary: (localCache[d.id]?.summary || autoInfo.reason)
        };
        localStorage.setItem("bar_radar_free_ai", JSON.stringify(localCache));
        render();
      };
      actions.appendChild(toggleBtn);

      card.appendChild(actions);
      list.appendChild(card);
    });
  }

  document.getElementById("tabFiltered").onclick = () => {
    activeTab = "filtered";
    document.getElementById("tabFiltered").classList.add("active");
    document.getElementById("tabRaw").classList.remove("active");
    render();
  };
  document.getElementById("tabRaw").onclick = () => {
    activeTab = "raw";
    document.getElementById("tabRaw").classList.add("active");
    document.getElementById("tabFiltered").classList.remove("active");
    render();
  };

  document.getElementById("batchAiBtn").onclick = async () => {
    const btn = document.getElementById("batchAiBtn");
    for (let i = 0; i < data.length; i++) {
      btn.textContent = `⏳ (${i + 1}/${data.length}) Analiz...`;
      await analyzeWithFreeAI(data[i]);
      render();
    }
    btn.textContent = "✅ Tüm Liste Filtrelendi";
    setTimeout(() => { btn.textContent = "⚡ Tümünü Ücretsiz AI ile Filtrele"; }, 3000);
  };

  q.addEventListener("input", render);
  citySel.addEventListener("change", render);
  render();
})();
</script>
</body>
</html>
